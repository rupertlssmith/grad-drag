# Netlify builds the site with elm-pages and publishes dist/. elm-pages compiles with Lamdera's
# compiler, so the build downloads it first; Elm's package cache is kept between builds.

[build]
  functions = "functions/"
  publish = "dist/"
  command = "mkdir bin && export PATH=\"/opt/build/repo/bin:$PATH\" && curl https://static.lamdera.com/bin/linux/lamdera -o bin/lamdera && chmod a+x bin/lamdera && export ELM_HOME=\"$NETLIFY_BUILD_BASE/cache/elm\" && npm install && npm run build"

[dev]
  command = "npm start"
  targetPort = 1234
  autoLaunch = true
  framework = "#custom"

[functions]
  node_bundler = "esbuild"
